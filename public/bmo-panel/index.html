<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2c">
  <meta name="robots" content="noindex">
  <title>Private sign in — &lt;/BMO&gt;</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header"><nav class="nav wrap"><a class="logo" href="/">&lt;/BMO&gt;</a><a class="checkout-return" href="/">← Storefront</a></nav></header>
  <main class="login-wrap">
    <form class="login-card" id="login-form">
      <span class="eyebrow">PRIVATE ACCESS</span><h1>Welcome back.</h1><p>Sign in to manage your shop.</p>
      <label>Username<input name="username" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="button button-wide" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
